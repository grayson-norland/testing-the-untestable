server.document-root = "/var/www/html"
server.port          = 8080
server.errorlog      = "/dev/stderr"

server.modules += ( "mod_rewrite", "mod_setenv", "mod_cgi", "mod_accesslog" )
accesslog.filename = "/dev/stdout"

# The two endpoints of the application (the rewrite sees path + query string)
url.rewrite-once = (
    "^/login$"            => "/cgi-bin/login.cgi",
    "^/search(\?.*)?$"    => "/cgi-bin/acctsrch.cgi$1"
)

# Programs in /cgi-bin are executed directly
cgi.assign = ( ".cgi" => "" )

# Hand the container's settings on to the CGI programs
setenv.add-environment = (
    "AUTH_URL" => env.AUTH_URL,
    "DB_HOST"  => env.DB_HOST,
    "DB_PORT"  => env.DB_PORT,
    "DB_NAME"  => env.DB_NAME
)

# The one static page (the terminal at "/"). Everything else stays plain text.
index-file.names = ( "index.html" )
mimetype.assign = (
    ".html" => "text/html; charset=utf-8",
    ""      => "text/plain"
)
